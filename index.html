<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mis 15 - Vanessa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 10px 40px;
      background: #fff5fa;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #333;
    }

    .contenedor {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    .invitacion {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }

    .personal {
      margin-top: 22px;
      padding: 24px 16px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .personal p {
      margin: 0 0 8px;
      font-size: 17px;
    }

    #nombre {
      margin: 5px 0 22px;
      color: #d63384;
      font-size: 27px;
    }

    .pregunta {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px !important;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 360px;
      margin: auto;
    }

    button {
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .si {
      background: #d63384;
      color: white;
    }

    .no {
      background: #f7d9e8;
      color: #9d245f;
    }

    .mensaje {
      margin-top: 18px;
      font-size: 17px;
      font-weight: bold;
      color: #d63384;
    }

    .error {
      color: #b00020;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <img
      class="invitacion"
      src="invitacion.jpg"
      alt="Invitación Mis 15 Vanessa"
    >

    <div class="personal" id="personal">

      <p>Esta invitación es personal para:</p>

      <h2 id="nombre"></h2>

      <p class="pregunta">¿Confirmas tu asistencia?</p>

      <div class="botones">
        <button class="si" onclick="respuestaPrueba('SI')">
          💗 Sí, asistiré
        </button>

        <button class="no" onclick="respuestaPrueba('NO')">
          🤍 No podré asistir
        </button>
      </div>

      <div id="mensaje" class="mensaje"></div>

    </div>

  </div>

  <script>

    const invitados = {
      "AFL43W": "Miguel Santibañez",
      "EKTCC9": "Vanessa Santibáñez",
      "M23YVB": "Anita González",
      "WDBMAN": "Benjamin Rojas",
      "UD6DQ2": "Valentina Cavagnaro",
      "7AP3CC": "Ruth Castellanos"
    };

    const parametros = new URLSearchParams(window.location.search);

    const codigo = (parametros.get("codigo") || "")
      .trim()
      .toUpperCase();

    const nombre = document.getElementById("nombre");
    const personal = document.getElementById("personal");

    if (codigo && invitados[codigo]) {

      nombre.textContent = invitados[codigo];

    } else {

      personal.innerHTML =
        '<p class="error">Esta invitación no es válida.</p>';

    }

    function respuestaPrueba(respuesta) {

      const mensaje = document.getElementById("mensaje");

      if (respuesta === "SI") {
        mensaje.textContent =
          "💗 ¡Gracias! Tu respuesta está lista para ser confirmada.";
      } else {
        mensaje.textContent =
          "Gracias por avisarnos 🤍";
      }

    }

  </script>

</body>
</html>
