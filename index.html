<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mis 15 - Vanessa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 10px 40px;
      background: #fff5fa;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #333;
    }

    .contenedor {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }

    .invitacion {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }

    .personal {
      margin-top: 22px;
      padding: 24px 16px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .personal p {
      margin: 0 0 8px;
      font-size: 17px;
    }

    #nombre {
      margin: 5px 0 22px;
      color: #d63384;
      font-size: 27px;
    }

    .pregunta {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px !important;
    }

    .botones {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 360px;
      margin: auto;
    }

    button {
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 30px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .si {
      background: #d63384;
      color: white;
    }

    .no {
      background: #f7d9e8;
      color: #9d245f;
    }

    .mensaje {
      margin-top: 20px;
      font-size: 17px;
      font-weight: bold;
      color: #d63384;
      line-height: 1.4;
    }

    .error {
      color: #b00020;
      font-weight: bold;
      font-size: 18px;
    }

    #formularioOculto {
      display: none;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <img
      class="invitacion"
      src="invitacion.jpg"
      alt="Invitación Mis 15 Vanessa"
    >

    <div class="personal" id="personal">

      <p>Esta invitación es personal para:</p>

      <h2 id="nombre"></h2>

      <p class="pregunta">¿Confirmas tu asistencia?</p>

      <div class="botones" id="botones">

        <button
          id="btnSi"
          class="si"
          onclick="enviarRespuesta('SI')">
          💗 Sí, asistiré
        </button>

        <button
          id="btnNo"
          class="no"
          onclick="enviarRespuesta('NO')">
          🤍 No podré asistir
        </button>

      </div>

      <div id="mensaje" class="mensaje"></div>

    </div>

  </div>


  <!-- FORMULARIO DE GOOGLE OCULTO -->

  <iframe
    name="formularioOculto"
    id="formularioOculto">
  </iframe>

  <form
    id="rsvpForm"
    action="https://docs.google.com/forms/d/e/1FAIpQLSdNOYnkNRQgnzKmWJZtbph1eb1iCWJJdHIMTABJsx2MC3_XCA/formResponse"
    method="POST"
    target="formularioOculto">

    <input
      type="hidden"
      name="entry.1708082868"
      id="campoCodigo">

    <input
      type="hidden"
      name="entry.1615105669"
      id="campoRespuesta">

  </form>


  <script>

    // ==================================================
    // INVITADOS Y CÓDIGOS
    // ==================================================

    const invitados = {

      // INVITADOS INICIALES

      "AFL43W": "Miguel Santibañez",
      "EKTCC9": "Vanessa Santibáñez",
      "M23YVB": "Anita González",
      "WDBMAN": "Benjamin Rojas",
      "UD6DQ2": "Valentina Cavagnaro",
      "7AP3CC": "Ruth Castellanos",


      // NUEVOS INVITADOS

      "4HKLT3": "Sebastiam Milanos",
      "Z3XAJK": "Mónica",
      "359WVN": "Franco Reyes",
      "5YLQK2": "Michelle",
      "KMGN58": "Isaías",
      "N2AWZB": "Mauner",
      "9BXZX8": "Daphne",
      "6R3S7J": "Stefy",
      "6E8GB8": "Paula",
      "8CFS42": "Sophie",
      "GUGPYK": "Antonella",
      "LCTMLX": "Florencia",
      "TREN94": "Paz",
      "ZVHCJE": "Ethan",
      "KYZTL2": "Yanara",
      "ARXU2T": "Estefanía",
      "26PZ78": "Polet"

    };


    // ==================================================
    // LEER CÓDIGO DESDE EL QR
    // ==================================================

    const parametros =
      new URLSearchParams(window.location.search);

    const codigo =
      (parametros.get("codigo") || "")
      .trim()
      .toUpperCase();


    const nombre =
      document.getElementById("nombre");

    const personal =
      document.getElementById("personal");

    const mensaje =
      document.getElementById("mensaje");

    const botones =
      document.getElementById("botones");


    // ==================================================
    // VALIDAR INVITACIÓN
    // ==================================================

    if (codigo && invitados[codigo]) {

      nombre.textContent =
        invitados[codigo];

    } else {

      personal.innerHTML =
        '<p class="error">Esta invitación no es válida.</p>';

    }


    // ==================================================
    // ENVIAR CONFIRMACIÓN
    // ==================================================

    function enviarRespuesta(respuesta) {

      if (!codigo || !invitados[codigo]) {
        return;
      }


      document
        .getElementById("campoCodigo")
        .value = codigo;


      document
        .getElementById("campoRespuesta")
        .value = respuesta;


      // Desactivar botones para evitar doble clic

      const botonesLista =
        botones.querySelectorAll("button");

      botonesLista.forEach(function(boton) {
        boton.disabled = true;
      });


      // Mostrar mensaje al invitado

      if (respuesta === "SI") {

        mensaje.innerHTML =
          "💗 ¡Muchas gracias, " +
          invitados[codigo] +
          "!<br>Tu asistencia ha sido confirmada.";

      } else {

        mensaje.innerHTML =
          "🤍 Gracias por avisarnos, " +
          invitados[codigo] +
          ".<br>Registramos que no podrás asistir.";

      }


      // Enviar respuesta al Google Form oculto

      document
        .getElementById("rsvpForm")
        .submit();

    }

  </script>

</body>
</html>
